[package]
name = "file_finder"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI парсинг аргументов - самая популярная библиотека для CLI в Rust
clap = { version = "4.5", features = ["derive"] }

# Параллельный обход файловой системы - быстрее чем обычный walkdir
jwalk = "0.8"

# Интерактивные меню и списки выбора
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# Красивый прогресс-бар
indicatif = "0.17"

# Работа с путями и кросс-платформенность
dunce = "1.0"

# Сериализация/десериализация для сохранения результатов
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Работа с датами/временем
chrono = { version = "0.4", features = ["serde"] }

# Форматирование размеров файлов (KB, MB, GB)
bytesize = "1.3"

# Цветной вывод в терминал
colored = "2.1"

# Обработка ошибок
anyhow = "1.0"
thiserror = "1.0"

# Работа с хешами для поиска дубликатов
sha2 = "0.10"

# Улучшенная работа с потоками (совместимая версия для Rust 1.77+)
rayon = "1.10"

# Кросс-платформенное открытие файлов/папок
opener = "0.7"

# Для работы с Windows API (получение списка дисков)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
# Максимальная оптимизация для release сборки
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lib]
name = "file_finder"
path = "src/lib.rs"
